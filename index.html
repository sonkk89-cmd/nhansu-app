<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Báo cáo nhân sự sản xuất</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="./config.js"></script><script src="./cloud.js"></script>
<style>
:root{--bg:#edf1f6;--card:#fff;--tx:#14202e;--mu:#5c6b80;--bd:#d8e0ea;--pr:#1e50a2;--pl:#e8f0fa;--ok:#0e9f6e;--wr:#c77a00;--er:#dc2626;--bar:#1e50a2;--green:#57b22e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#eef3f9,#e4ebf3);background-attachment:fixed;color:var(--tx);font:14px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.topbar{background:linear-gradient(120deg,#1e50a2,#123a78);color:#fff;box-shadow:0 3px 16px rgba(18,42,90,.25)}.topbar-in{max-width:1200px;min-height:66px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}.brand-mark{font:600 12px/1.1 "IBM Plex Mono",Consolas,monospace;letter-spacing:.1em;border:1px solid var(--green);border-radius:7px;padding:8px;color:#fff;background:rgba(255,255,255,.1);box-shadow:0 0 0 3px rgba(87,178,46,.12);flex:none}.head-copy{flex:1;min-width:160px}h1{font-size:16px;line-height:1.2;margin:0 0 3px;font-weight:700}.sub{color:rgba(255,255,255,.7);font-size:11px}.account{font-size:12px;color:rgba(255,255,255,.82);text-align:right}.account a{color:#fff;text-decoration:none;font-weight:600}.account a:hover{text-decoration:underline}
nav{display:flex;gap:7px;overflow-x:auto;padding:10px max(16px,calc((100% - 1168px)/2));position:sticky;top:env(safe-area-inset-top,0px);background:#123a78;z-index:5;box-shadow:0 3px 12px rgba(18,42,90,.14);scrollbar-width:thin}nav button{white-space:nowrap;border:1px solid rgba(255,255,255,.19);background:rgba(255,255,255,.1);color:#fff;padding:7px 12px;border-radius:7px;cursor:pointer;font:600 12px/1.3 "IBM Plex Sans",system-ui,sans-serif;transition:background .15s,border-color .15s}nav button:hover{background:rgba(255,255,255,.2)}nav button.on{background:#fff;color:var(--pr);border-color:#fff}
main{max-width:1200px;margin:0 auto;padding:16px 16px 48px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(20,32,46,.035)}.grid .card{margin:0}.k{font-size:12px;color:var(--mu)}.v{font-size:28px;font-weight:700;line-height:1.2;color:var(--tx)}.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}.cols .card{margin:0}h3{font-size:14px;margin:0 0 10px;font-weight:700;color:var(--tx)}
.bar{display:grid;grid-template-columns:110px 1fr 44px;gap:8px;align-items:center;margin:6px 0;font-size:13px}.bar i{display:block;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--pr),#4d7fcb);min-width:2px}.bar .t{background:var(--pl);border-radius:5px}.bar b{text-align:right}.bar span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:10px;background:var(--card)}table{border-collapse:collapse;width:100%;font-size:12.5px}th,td{padding:8px 10px;text-align:left;border-bottom:1px solid #e9eef4;white-space:nowrap}th{background:#f4f7fb;color:var(--mu);position:sticky;top:0;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;font-weight:700}tr:last-child td{border-bottom:0}tbody tr:hover{background:#f8fafc}td.n,th.n{text-align:right}
.tb{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px;align-items:center}input,select,button.b{font:inherit;padding:8px 10px;border:1.5px solid var(--bd);border-radius:8px;background:#fff;color:var(--tx);min-width:0}input:focus,select:focus{outline:none;border-color:var(--pr);box-shadow:0 0 0 3px rgba(30,80,162,.12)}button.b{cursor:pointer;background:linear-gradient(135deg,var(--pr),#123a78);color:#fff;border-color:var(--pr);font-weight:700;box-shadow:0 3px 10px rgba(30,80,162,.16)}button.b:hover{filter:brightness(1.06)}button.g{background:#fff;color:var(--mu);border-color:var(--bd);box-shadow:none}button.r{background:#fff;color:var(--er);border-color:#f0c9c9;padding:4px 9px;font-size:12px;box-shadow:none}.seg button{border:1px solid var(--bd);background:#fff;color:var(--tx);padding:7px 12px;cursor:pointer;font:inherit}.seg button:first-child{border-radius:8px 0 0 8px}.seg button:last-child{border-radius:0 8px 8px 0}.seg button.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.f label{display:block;font-size:12px;color:var(--mu);font-weight:600}.f input,.f select{width:100%}.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;background:var(--pl);color:var(--pr);font-weight:700}.note{color:var(--mu);font-size:12px;margin:6px 0}.msg{color:var(--ok);font-size:13px;margin:8px 0}.msg.e{color:var(--er)}.mo{position:fixed;inset:0;background:rgba(14,42,82,.65);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}.mo>div{background:var(--card);border:1px solid var(--bd);border-top:4px solid var(--green);border-radius:12px;padding:18px;width:100%;max-width:420px;box-shadow:0 18px 50px rgba(8,20,45,.24)}.cl{cursor:pointer}.cl:hover{border-color:var(--pr)}.sel{border-color:var(--pr);background:var(--pl)}
@media(max-width:600px){.topbar-in{min-height:60px;padding:9px 12px;gap:9px}.brand-mark{font-size:10px;padding:7px}.head-copy{min-width:120px}h1{font-size:14px}.account{font-size:11px}nav{padding:8px 12px;gap:6px}nav button{padding:7px 10px}main{padding:12px 12px 36px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.grid .card{padding:11px}.v{font-size:24px}.cols{grid-template-columns:1fr}.bar{grid-template-columns:90px 1fr 34px;gap:6px}}

/* Tighter rows and spacing on the overview tab */
#app.overview .card{padding:10px;margin-bottom:8px}

#app.overview .overview-line-card{width:100%}
#app.overview .overview-line-chart-bars{height:130px!important}
</style></head><body>
<header class="topbar"><div class="topbar-in"><div class="brand-mark">Production - ILS</div><div class="head-copy"><h1>Báo cáo nhân sự – Bộ phận sản xuất</h1><div class="sub" id="sub"></div></div><div class="account"><span id="me"></span> · <a href="#" onclick="HRCloud.logout(event)">Đăng xuất</a></div></div></header>
<nav id="nav"></nav><main id="app"></main><div id="modal"></div>
<script>
let D={E:[],R:[],L:[],me:{name:"",role:""}};
const TABS=['Tổng quan','DS nhân viên','Theo line','Theo Leader','Theo loại','Nghỉ hằng ngày','Nghỉ việc','Thêm / Nghỉ việc','Quản trị'];
const WD=['Chủ nhật','Thứ 2','Thứ 3','Thứ 4','Thứ 5','Thứ 6','Thứ 7'];
const CODE={P:'Phép năm (P)',"P/2":'Phép năm nửa ngày (P/2)',TD:'Nghỉ tự do (TD)',R:'Không lương (R)',RCC:'Không lương CC (RCC)',O:'Nghỉ ốm (O)',Stop:'Báo nghỉ việc',"ĐM":'Đi muộn'};
const TYPES=['Chính thức','Thời vụ','Sinh viên'];
const TD=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
let S={adds:[],res:{},leaves:[]},tab=0,st={sh:['A','C','HC'],lt:[],ld:'',line:'',type:'Chính thức',q:'',mode:'day',day:TD,mon:TD.slice(0,7),yr:TD.slice(0,4),rq:'',rm:'',rt:'',rn:100,mq:'',mn:100,lq:'',msg:''};
let db=null,docRef=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fd=d=>d?d.split('-').reverse().join('/'):'';
const nz=s=>(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').toLowerCase();
const cnt=(a,f)=>{const o={};a.forEach(x=>{const k=f(x)||'(trống)';o[k]=(o[k]||0)+1});return o};
const wdOf=d=>WD[new Date(d+'T00:00:00').getDay()];
function emps(){return D.E.concat(S.adds).filter(e=>!S.res[e[0]])}
function resigned(){return D.E.concat(S.adds).filter(e=>S.res[e[0]]).map(e=>[e[0],e[1],e[2],e[3],e[4],e[5],e[6],S.res[e[0]][0],S.res[e[0]][1],1]).concat(D.R).sort((a,b)=>(b[7]||'').localeCompare(a[7]||''))}
function leaves(){return D.L.map(x=>x.concat(1)).concat(S.leaves.map(x=>x.concat(1)))}
function bars(o,tot,click){const m=Math.max(1,...Object.values(o));return Object.entries(o).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="bar ${click?'cl':''}" ${click?`onclick="${click}('${esc(k).replace(/'/g,"\\'")}')"`:''}><span title="${esc(k)}">${esc(k)}</span><span class="t"><i style="width:${v/m*100}%"></i></span><b>${v}</b></div>`).join('')||'<div class="note">Không có dữ liệu</div>'}
function barsO(keys,o){const m=Math.max(1,...keys.map(k=>o[k]||0));return keys.map(k=>`<div class="bar"><span>${esc(k)}</span><span class="t"><i style="width:${(o[k]||0)/m*100}%"></i></span><b>${o[k]||0}</b></div>`).join('')}
function kpi(a){return `<div class="grid">${a.map(([k,v,s])=>`<div class="card"><div class="k">${k}</div><div class="v">${v}</div>${s?`<div class="k" style="margin-top:2px">${s}</div>`:''}</div>`).join('')}</div>`}
function tbl(h,rows,more){return `<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${c??''}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${h.length}" class="note">Không có dữ liệu</td></tr>`}</table></div>${more||''}`}
function shiftKpi(a){const c=cnt(a,e=>e[3]),gs=r=>{const g=cnt(r,e=>{const n=nz(e[9]);return n==='nam'?'Nam':n==='nu'?'Nữ':'Khác'});return `Nam ${g.Nam||0} · Nữ ${g['Nữ']||0}${g['Khác']?' · Chưa rõ '+g['Khác']:''}`},s=k=>gs(a.filter(e=>e[3]===k));return kpi([['Tổng nhân lực',a.length,gs(a)],['Ca A',c.A||0,s('A')],['Ca C',c.C||0,s('C')],['Hành chính (HC)',c.HC||0,s('HC')]])}
const eRow=e=>[esc(e[0]),esc(e[1]),esc(e[3]),esc(e[4]),esc(e[5]),esc(e[6]),esc(e[7]),esc(e[8]),fd(e[2])];
const eH=['Mã NV','Họ tên','Ca','Loại','Vendor','Line','Chức vụ','Quản lý','Ngày vào'];
function setTab(i){tab=i;st.msg='';render();if(i===8)loadAdmin()}
function go(k,v){st[k]=v;render()}
function inp(k,v){st[k]=v;const p=document.activeElement.selectionStart;render();const el=document.querySelector('[data-k="'+k+'"]');if(el){el.focus();try{el.setSelectionRange(p,p)}catch(e){}}}

function tg(s){const i=st.sh.indexOf(s);i>=0?st.sh.splice(i,1):st.sh.push(s);render()}
const sf=s=>st.sh.length===3||st.sh.includes(s);
function chkb(){return `<div class="tb"><span class="k">Hiển thị ca:</span>${[['A','Ca A'],['C','Ca C'],['HC','HC']].map(([k,l])=>`<label class="card" style="margin:0;padding:7px 12px;cursor:pointer;display:flex;gap:6px;align-items:center"><input type="checkbox" ${st.sh.includes(k)?'checked':''} onchange="tg('${k}')">${l}</label>`).join('')}</div>`}
function tgT(k){const i=st.lt.indexOf(k);i>=0?st.lt.splice(i,1):st.lt.push(k);render()}
function ltCards(f){const T=[['Chính thức','Chính thức'],['Thời vụ','Thời vụ'],['Sinh viên','Sinh viên'],['?','Chưa có trong DS']];return `<div class="grid">${T.map(([k,l])=>{const n=f.filter(x=>(x[4]||'?')===k).length,on=st.lt.includes(k);return `<label class="card cl ${on?'sel':''}" style="display:block"><div style="display:flex;gap:8px;align-items:center"><input type="checkbox" ${on?'checked':''} onchange="tgT('${k}')"><span class="k">${l}</span></div><div class="v">${n}</div><div class="k">người nghỉ · tích để xem danh sách</div></label>`}).join('')}</div>`}
function vEmpLeave(){const all=D.E.concat(S.adds),e=all.find(x=>x[0]===st.le),yr=st.ly||st.yr,ls=e?leaves().filter(x=>x[0]===st.le&&x[7].startsWith(yr)).sort((a,b)=>a[7].localeCompare(b[7])):[],cd=cnt(ls,x=>CODE[x[5]]||x[5]),mo=cnt(ls,x=>x[7].slice(5,7)),mk=Array.from({length:12},(_,i)=>String(i+1).padStart(2,'0'));
 const hd=`<h3>Tra cứu số ngày nghỉ của 1 nhân viên trong năm</h3><div class="tb"><input list="el2" placeholder="Gõ mã hoặc tên nhân viên" value="${e?esc(e[0]+' - '+e[1]):''}" onchange="go('le',this.value.split(' - ')[0].trim())" style="min-width:240px"><datalist id="el2">${all.map(x=>`<option value="${esc(x[0])} - ${esc(x[1])}">`).join('')}</datalist><input type="number" min="2020" max="2100" value="${yr}" onchange="go('ly',this.value)" style="width:100px"></div>`;
 if(!e)return `<div class="card" style="margin-top:12px">${hd}<div class="note">Chọn nhân viên để xem chi tiết. Mỗi lượt ghi nhận tính là 1 ngày nghỉ.</div></div>`;
 return `<div class="card" style="margin-top:12px">${hd}<div class="note" style="margin:0 0 10px"><b>${esc(e[1])}</b> · Mã ${esc(e[0])} · ${esc(e[6])} · Ca ${esc(e[3])} · ${esc(e[4])}${S.res[e[0]]?' · <span style="color:var(--er)">Đã nghỉ việc</span>':''}</div>`+kpi([['Tổng ngày nghỉ năm '+yr,ls.reduce((n,x)=>n+(x[5]==='P/2'?0.5:1),0)],['Phép năm đã dùng (ngày)',ls.reduce((n,x)=>n+(x[5]==='P'?1:x[5]==='P/2'?0.5:0),0)],['Nghỉ tự do (TD)',ls.filter(x=>x[5]==='TD').length],['Loại khác',ls.filter(x=>x[5]!=='P'&&x[5]!=='TD').length]])+`<div class="cols" style="margin-bottom:12px"><div class="card"><h3>Theo tháng</h3>${barsO(mk,mo)}</div><div class="card"><h3>Theo loại nghỉ</h3>${bars(cd,ls.length)}</div></div>`+tbl(['STT','Ngày','Thứ','Loại nghỉ','Lý do'],ls.map((x,i)=>[i+1,fd(x[7]),wdOf(x[7]),esc(CODE[x[5]]||x[5]),esc(x[6])]))+`</div>`}
function ovAtt(a){const ab=new Set(leaves().filter(x=>x[7]===st.day).map(x=>x[0])),n=a.filter(e=>ab.has(e[0])).length,w=a.length-n,pc=a.length?(n/a.length*100).toFixed(1):'0.0',tile=(l,v,c)=>`<div style="flex:1;border:1px solid var(--bd);border-left:4px solid ${c};border-radius:8px;padding:8px 10px"><div class="k">${l}</div><div class="v" style="font-size:24px">${v}</div></div>`;
 return `<div style="margin-top:14px"><div class="k" style="margin-bottom:6px">Nhân lực đi làm / nghỉ – ngày ${fd(st.day)}</div><div style="display:flex;gap:8px;margin-bottom:10px">${tile('Nhân lực đi làm',w,CL.w)}${tile('Nhân lực nghỉ',n,CL.a)}${tile('Tỷ lệ nghỉ',pc+'%','var(--mu)')}</div>${tbl(['Ca','Đi làm','Nghỉ'],['A','C','HC'].map(c=>{const x=a.filter(e=>e[3]===c),k=x.filter(e=>ab.has(e[0])).length;return [c==='HC'?'HC':'Ca '+c,x.length-k,k]}))}</div>`}
function vNew(){
 const day=st.day,act=emps().filter(e=>sf(e[3])),rs=resigned().filter(e=>sf(e[3])),o={};
 for(let i=13;i>=0;i--){const d=new Date(day+'T00:00:00Z');d.setUTCDate(d.getUTCDate()-i);o[d.toISOString().slice(0,10)]=0}
 act.concat(rs).forEach(e=>{if(e[2] in o)o[e[2]]++});
 const q={};Object.keys(o).forEach(k=>q[k]=0);rs.forEach(e=>{if(e[7] in q)q[e[7]]++});
 const ks=Object.keys(o),m=Math.max(1,...Object.values(o),...Object.values(q)),sum=n=>ks.slice(-n).reduce((s,k)=>s+o[k],0);
 const d0=act.filter(e=>e[2]===day),d1=rs.filter(e=>e[7]===day),n=d0.length,tp=cnt(d0,e=>e[4]);
 const col=ks.map(k=>`<div class="cl" onclick="go('day','${k}')" title="${fd(k)}: vào mới ${o[k]}, nghỉ việc ${q[k]}" style="flex:1;min-width:48px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%"><div style="display:flex;gap:3px;align-items:flex-end;justify-content:center;width:90%">${[[o[k],'var(--ok)'],[q[k],'var(--er)']].map(([v,c])=>`<div style="display:flex;flex-direction:column;align-items:center;justify-content:flex-end;flex:1"><b style="font-size:11px;color:${c}">${v}</b><i style="display:block;width:100%;min-height:2px;border-radius:3px 3px 0 0;background:${c};opacity:${k===day?1:.5};height:${v/m*110}px"></i></div>`).join('')}</div><span style="font-size:11px;margin-top:4px;text-align:center;line-height:1.2;${k===day?'font-weight:700;color:var(--tx)':'color:var(--mu)'}">${k.slice(8)}/${k.slice(5,7)}</span></div>`).join('');
 const activeRows=d0.map(e=>[esc(e[0]),esc(e[1]),fd(e[2]),esc(e[3]),esc(e[4]),esc(e[5]),esc(e[6])]);
 const resignedRows=d1.map(e=>[esc(e[0]),esc(e[1]),fd(e[2]),esc(e[3]),esc(e[4]),esc(e[5]),esc(e[6]),fd(e[7]),esc(e[8])||'<span class="note">(chưa ghi lý do)</span>']);
 const detail=(d0.length?`<div style="margin-top:10px"><h3>Nhân viên vào mới trong ngày: ${d0.length}</h3>`+tbl(['Mã NV','Họ tên','Ngày vào','Ca','Loại','Vendor','Line'],activeRows)+`</div>`:'')+
  (d1.length?`<div style="margin-top:10px"><h3>Nhân viên nghỉ việc trong ngày: ${d1.length}</h3>`+tbl(['Mã NV','Họ tên','Ngày vào','Ca','Loại','Vendor','Line','Ngày nghỉ','Lý do'],resignedRows)+`</div>`:'');
 return `<div class="card" style="margin-top:12px"><h3>Nhân viên vào mới (theo ngày vào) – ${n} người ngày ${fd(day)}${n?' ('+Object.entries(tp).map(([k,v])=>k+' '+v).join(' · ')+')':''}</h3><div class="note" style="margin:0 0 6px">7 ngày gần nhất: <b>${sum(7)}</b> · 14 ngày: <b>${sum(14)}</b> · nghỉ việc 7 ngày: <b>${ks.slice(-7).reduce((s,k)=>s+q[k],0)}</b> · <span style="color:var(--ok)">■ Vào mới</span> <span style="color:var(--er)">■ Nghỉ việc</span> · bấm vào cột để chọn ngày</div><div style="display:flex;gap:4px;align-items:flex-end;height:170px;overflow-x:auto;padding-top:6px">${col}</div>${detail}</div>`
}
const CL={w:'var(--bar)',a:'var(--wr)',r:'var(--er)'};
function ovData(kf,ft){const day=st.day,ym=day.slice(0,7),ab=new Set(leaves().filter(x=>x[7]===day).map(x=>x[0])),o={},g=k=>{k=k||'(trống)';return o[k]||(o[k]={w:0,a:0,r:0})};

  <p class="note">Đã nhập: ${j.done.adds} nhân viên mới · ${j.done.res} nghỉ việc · ${j.done.leaves} lượt nghỉ.${j.errors?` Bỏ qua ${j.errors} dòng lỗi.`:''}</p>`+
  tbl(['Số liệu trong hệ thống','Trước → Sau'],[['Nhân viên đang làm',df(b.active,a.active)],['Người đã nghỉ việc',df(b.resigned,a.resigned)],['Lượt nghỉ hằng ngày',df(b.leaves,a.leaves)]])+
  `<p class="note">Số liệu này do máy chủ đếm lại sau khi ghi, bạn đối chiếu với số dòng trong file. Lịch sử nhập xem ở tab Quản trị.</p><div class="tb"><button class="b" onclick="closeM()">Đóng</button></div></div></div>`;
  await load()}catch(e){$('modal').innerHTML=`<div class="mo"><div><h3 style="color:var(--er)">✖ Không kết nối được máy chủ</h3><p>Chưa biết dữ liệu đã được ghi hay chưa. Mở lại trang, xem số nhân viên rồi nhập lại nếu cần (hệ thống tự bỏ qua dòng đã có).</p><div class="tb"><button class="b g" onclick="closeM()">Đóng</button></div></div></div>`}}

function exportTabXlsx(){
 const wb=XLSX.utils.book_new(),sheet=(name,head,rows)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([head,...rows]),name);
 const empRows=a=>a.map(e=>[e[0],e[1],e[2],e[3],e[4],e[5],e[6],e[7],e[8],e[9]]);
 const resignRows=a=>a.map(e=>[e[0],e[1],e[2],e[4],e[5],e[6],e[3],e[7],e[8]]);
 const leaveRows=a=>a.map(x=>[x[0],x[1],x[2],x[3],x[4],CODE[x[5]]||x[5],x[6],x[7]]);
 const eh=['Mã NV','Họ tên','Ngày vào','Ca','Loại nhân lực','Vendor','Line','Chức vụ','Quản lý','Giới tính'];
 const rh=['Mã NV','Họ tên','Ngày vào','Loại nhân lực','Vendor','Line','Ca','Ngày nghỉ','Lý do'];
 const lh=['Mã NV','Họ tên','Line','Ca','Loại nhân lực','Loại nghỉ','Lý do','Ngày'];
 const act=emps(),res=resigned(),allL=leaves();
 let label=TABS[tab]||'Du_lieu';
 if(tab===0){
  const visible=act.filter(e=>sf(e[3])),todayL=allL.filter(x=>x[7]===st.day);
  const from=new Date(st.day+'T00:00:00Z');from.setUTCDate(from.getUTCDate()-13);const start=from.toISOString().slice(0,10);
  sheet('Tong hop',['Chỉ tiêu','Số lượng'],[['Nhân viên đang làm theo ca chọn',visible.length],['Nghỉ ngày '+st.day,todayL.length],['Phép năm ngày quy đổi',todayL.reduce((n,x)=>n+(x[5]==='P'?1:x[5]==='P/2'?0.5:0),0)]]);
  sheet('Nhan vien dang lam',eh,empRows(visible));
  sheet('Nghi ngay '+st.day,lh,leaveRows(todayL));
  sheet('Vao moi 14 ngay',eh.slice(0,7),act.filter(e=>e[2]>=start&&e[2]<=st.day).map(e=>e.slice(0,7)));
  sheet('Nghi viec 14 ngay',rh.filter((_,i)=>i!==3),res.filter(e=>e[7]>=start&&e[7]<=st.day).map(e=>[e[0],e[1],e[2],e[4],e[5],e[6],e[3],e[7],e[8]]));
 }else if(tab===1){
  const q=nz(st.eq||''),a=act.slice().sort((x,y)=>String(x[0]).localeCompare(String(y[0]),'vi')).filter(e=>!q||nz(e.join(' ')).includes(q));
  sheet('DS nhan vien',eh,empRows(a));
 }else if(tab===2){
  const a=act.filter(e=>e[6]===st.line&&sf(e[3])&&(!st.q||nz(e.join(' ')).includes(nz(st.q))));
  sheet('Theo line',eh,empRows(a));label='Theo_line';
 }else if(tab===3){
  const lk=e=>e[8]||'(trống)',a=act.filter(e=>lk(e)===st.ld&&sf(e[3])&&(!st.q||nz(e.join(' ')).includes(nz(st.q))));
  sheet('Theo Leader',eh,empRows(a));label='Theo_Leader';
 }else if(tab===4){
  const a=act.filter(e=>sf(e[3])&&e[4]===st.type&&(!st.q||nz(e.join(' ')).includes(nz(st.q))));
  sheet('Theo loai',eh,empRows(a));label='Theo_loai';
 }else if(tab===5){
  let a=allL.filter(x=>sf(x[3]));
  if(st.mode==='day')a=a.filter(x=>x[7]===st.day);
  else if(st.mode==='mon')a=a.filter(x=>x[7].startsWith(st.mon));
  else if(st.mode==='yr')a=a.filter(x=>x[7].startsWith(st.yr));
  sheet('Nghi hang ngay',lh,leaveRows(a));label='Nghi_hang_ngay';
 }else if(tab===6){
  let a=res.filter(x=>sf(x[3]));
  a=a.filter(x=>(!st.rm||(x[7]||'').startsWith(st.rm))&&(!st.rt||x[4]===st.rt)&&(!st.rq||nz(x.join(' ')).includes(nz(st.rq))));
  sheet('Nghi viec',rh,resignRows(a));label='Nghi_viec';
 }else if(tab===7){
  sheet('Nhan vien dang lam',eh,empRows(act.filter(e=>sf(e[3]))));
  sheet('Nhan vien nghi viec',rh,resignRows(res.filter(e=>sf(e[3]))));
  sheet('Nghi hang ngay',lh,leaveRows(allL.filter(x=>sf(x[3]))));label='Them_Nghi_viec';
 }else if(tab===8){
  sheet('Tai khoan',['Tên đăng nhập','Tên hiển thị','Vai trò'],(st.users||[]).map(u=>[u.username,u.name,ROLEL[u.role]||u.role]));
  sheet('Kiem tra',['Hạng mục','Số lượng','Ví dụ'],((st.checks||{}).items||[]).map(i=>[i.label,i.count,(i.sample||[]).join(' · ')]));
  sheet('Lich su nhap',['Thời gian','Người nhập','File','Nhân viên mới','Nghỉ việc','Nghỉ ngày','Lỗi bỏ qua'],(st.imps||[]).map(i=>[i.at,i.user,i.file,i.summary?.ok?.adds||0,i.summary?.ok?.res||0,i.summary?.ok?.leaves||0,i.summary?.errors||0]));
  sheet('Nhat ky',['Thời gian','Người thực hiện','Thao tác','Chi tiết'],(st.audit||[]).map(i=>[i.at,i.user,ACTL[i.action]||i.action,i.detail]));label='Quan_tri';
 }
 const date=new Date().toISOString().slice(0,10);
 XLSX.writeFile(wb,'bao_cao_'+label+'_'+date+'.xlsx');
}

async function exportXlsx(){const wb=XLSX.utils.book_new(),A=(h,r)=>XLSX.utils.aoa_to_sheet([h].concat(r));
 XLSX.utils.book_append_sheet(wb,A(['Mã NV','Họ tên','Ngày vào','Ca','Loại','Vendor','Line','Chức vụ','Quản lý','Giới tính'],emps()),'DS nhân viên');
 XLSX.utils.book_append_sheet(wb,A(['Mã NV','Họ tên','Ngày vào','Ca','Loại','Vendor','Line','Ngày nghỉ','Lý do'],resigned().map(x=>x.slice(0,9))),'DS nghỉ việc');
 XLSX.utils.book_append_sheet(wb,A(['Mã NV','Họ tên','Line','Ca','Loại NL','Loại nghỉ','Lý do','Ngày'],leaves().map(x=>x.slice(0,8))),'Nghỉ hằng ngày');
 const buf=XLSX.write(wb,{bookType:'xlsx',type:'array'});
 XLSX.writeFile(wb,'bao_cao_nhan_su.xlsx')}
const ROLEL={admin:'Quản trị (toàn quyền)',editor:'Nhập liệu',viewer:'Chỉ xem'},ACTL={employee_edit:'Sửa thông tin nhân viên',add_employee:'Thêm nhân viên',resign:'Nghỉ việc',restore:'Khôi phục',leave:'Ghi nghỉ',delete_leave:'Xóa nghỉ',user_save:'Lưu tài khoản',user_delete:'Xóa tài khoản',import:'Nhập từ Excel'};
async function loadAdmin(){try{const [u,a,c,im]=await Promise.all([HRCloud.api('/api/users'),HRCloud.api('/api/audit'),HRCloud.api('/api/checks'),HRCloud.api('/api/imports')]);if(u.ok)st.users=await u.json();if(a.ok)st.audit=await a.json();if(c.ok)st.checks=await c.json();if(im.ok)st.imps=await im.json();render()}catch(e){}}
async function saveUser(){const b={username:$('aU').value.trim(),name:$('aN').value.trim(),role:$('aR').value,password:$('aP').value};
 const r=await HRCloud.api('/api/users',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}),j=await r.json();
 st.msg=r.ok?'Đã lưu tài khoản '+b.username:'!'+(j.error||'Lỗi');await loadAdmin()}
async function delUser(u){if(!confirm('Xóa tài khoản '+u+'?'))return;const r=await HRCloud.api('/api/users/'+encodeURIComponent(u),{method:'DELETE'}),j=await r.json();
 st.msg=r.ok?'Đã xóa tài khoản '+u:'!'+(j.error||'Lỗi');await loadAdmin()}
function editUser(u){const x=(st.users||[]).find(y=>y.username===u);if(!x)return;$('aU').value=x.username;$('aN').value=x.name;$('aR').value=x.role;$('aP').value='';$('aP').focus()}
function vAdmin(){const us=st.users||[],au=(st.audit||[]).slice(0,200);
 return `<div class="card"><h3>Tạo mới / sửa tài khoản</h3><div class="f"><div><label>Tên đăng nhập</label><input id="aU" autocomplete="off"></div><div><label>Tên hiển thị</label><input id="aN"></div><div><label>Vai trò</label><select id="aR">${Object.entries(ROLEL).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div><div><label>Mật khẩu (từ 8 ký tự; để trống nếu chỉ sửa tên/vai trò)</label><input id="aP" type="password" autocomplete="new-password"></div></div>
 <div class="tb" style="margin-top:10px"><button class="b" onclick="saveUser()">Lưu tài khoản</button><span class="msg ${st.msg.startsWith('!')?'e':''}">${esc(st.msg.replace('!',''))}</span></div>
 <p class="note">Gõ tên đăng nhập đã có rồi lưu để đổi mật khẩu hoặc vai trò. Người bị đổi quyền hoặc đổi mật khẩu sẽ phải đăng nhập lại. Luôn giữ ít nhất một tài khoản admin.</p></div>`+
 tbl(['Tên đăng nhập','Tên hiển thị','Vai trò',''],us.map(u=>[esc(u.username),esc(u.name),esc(ROLEL[u.role]||u.role),`<button class="b g" style="padding:4px 9px;font-size:12px" onclick="editUser('${esc(u.username)}')">Sửa</button> `+(u.username===D.me.username?'':`<button class="r" onclick="delUser('${esc(u.username)}')">Xóa</button>`)]))+
 `<h3 style="margin:16px 0 8px">Kiểm tra chất lượng dữ liệu</h3><div class="tb"><button class="b g" onclick="loadAdmin()">Kiểm tra lại</button><span class="note">${st.checks?`Trong hệ thống: ${st.checks.counts.active} đang làm · ${st.checks.counts.resigned} đã nghỉ việc · ${st.checks.counts.leaves} lượt nghỉ (lúc ${new Date(st.checks.at).toLocaleTimeString('vi-VN')})`:''}</span></div>`+
 tbl(['Kiểm tra','Số lượng','Ví dụ (tối đa 8)'],((st.checks||{}).items||[]).map(i=>[esc(i.label),i.count?`<b style="color:var(--wr)">${i.count}</b>`:'<span style="color:var(--ok)">✔ 0</span>',esc(i.sample.join(' · '))]))+
 `<h3 style="margin:16px 0 8px">Lịch sử nhập từ Excel</h3>`+
 tbl(['Thời gian','Người nhập','File','Đã nhập (NV mới / nghỉ việc / nghỉ ngày)','Lỗi bỏ qua','Đang làm: trước → sau'],(st.imps||[]).map(r=>[new Date(r.at).toLocaleString('vi-VN'),esc(r.user),esc(r.file),`${r.summary.ok.adds} / ${r.summary.ok.res} / ${r.summary.ok.leaves}`,r.summary.errors,`${r.summary.before.active} → ${r.summary.after.active}`]))+
 `<h3 style="margin:16px 0 8px">Nhật ký thao tác (200 lần gần nhất)</h3>`+
 tbl(['Thời gian','Người thực hiện','Thao tác','Chi tiết'],au.map(a=>[new Date(a.at).toLocaleString('vi-VN'),esc(a.user),esc(ACTL[a.action]||a.action),esc(a.detail)]))}
async function save(ok){const b={adds:S.adds,res:S.res,restore:S.restore||[],leaves:S.leaves,delL:S.delL||[]};let err='';
 try{const r=await HRCloud.api('/api/delta',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
  if(r.status===401){location=window.HR_CONFIG.basePath+'login.html';return}
  if(!r.ok)err=(await r.json()).error||'Lỗi lưu dữ liệu'}catch(e){err='Không kết nối được máy chủ'}
 if(err){const dup=/duplicate key|employees_pkey|employees_id_key/i.test(err),message=dup?'Mã NV đã tồn tại trong dữ liệu. Hãy kiểm tra mã nhân viên rồi thử lại.':'THẤT BẠI, chưa lưu: '+err;st.msg='!'+message;alert(message);await load();return}
 S={adds:[],res:{},leaves:[]};st.msg=ok||'Đã lưu vào máy chủ';await load()}
async function load(){try{const r=await HRCloud.api('/api/data');if(r.status===401){location=window.HR_CONFIG.basePath+'login.html';return}if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.error||'HTTP '+r.status)}D=await r.json();if(Array.isArray(D.L))D.L=D.L.map(x=>{if(Array.isArray(x)&&x[7])x[7]=String(x[7]).slice(0,10);return x});$('me').textContent=D.me.name+' ('+D.me.role+')';render()}catch(e){$('sub').textContent='Lỗi tải dữ liệu từ máy chủ: '+String(e?.message||e||'Lỗi không xác định')}}
function render(){if(tab===8&&D.me.role!=='admin')tab=0;$('app').className=tab===0?'overview':'';$('nav').innerHTML=TABS.map((t,i)=>i===8&&D.me.role!=='admin'?'':`<button class="${i===tab?'on':''}" onclick="setTab(${i})">${t}</button>`).join('');
 $('sub').textContent='Dữ liệu trực tiếp · '+emps().length+' đang làm · '+resigned().length+' đã nghỉ việc · '+(D.L||[]).length+' lượt nghỉ đã tải';
 const keep=window.scrollY;$('app').innerHTML='<div class="tb" style="justify-content:flex-end"><button class="b g" onclick="exportTabXlsx()">Xuất Excel tab này</button></div>'+[vOverview,vEmployees,vLine,vLeader,vType,vLeave,vResign,vManage,vAdmin][tab]();}
load();setInterval(()=>{if(!document.activeElement.matches('input,select'))load()},60000);
</script></body></html>
