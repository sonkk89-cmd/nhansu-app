<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đăng nhập</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px;background:linear-gradient(150deg,rgba(18,42,90,.7),rgba(13,30,66,.88)),radial-gradient(ellipse at 20% 10%,#6f96c8,#173c72 55%,#0e2449);font:14px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#14202e}
form{background:rgba(255,255,255,.98);border:0;border-top:4px solid #57b22e;border-radius:16px;padding:0 24px 24px;width:100%;max-width:380px;box-shadow:0 24px 70px rgba(8,20,45,.48);overflow:hidden}form:before{content:"HR · ILS";display:block;margin:0 -24px 20px;padding:22px 24px 18px;background:linear-gradient(135deg,#1e50a2,#123a78);color:#fff;font:600 12px "IBM Plex Mono",Consolas,monospace;letter-spacing:.12em;text-align:center;border-bottom:1px solid rgba(255,255,255,.1)}h1{font-size:18px;line-height:1.3;margin:0 0 16px;text-align:center;color:#14202e}input,button{width:100%;padding:11px 12px;margin:6px 0;border:1.5px solid #d8e0ea;border-radius:9px;font:inherit}input:focus{outline:none;border-color:#1e50a2;box-shadow:0 0 0 3px rgba(30,80,162,.12)}button{background:linear-gradient(135deg,#1e50a2,#123a78);color:#fff;border:0;cursor:pointer;font-weight:700;box-shadow:0 4px 14px rgba(30,80,162,.25)}button:hover{filter:brightness(1.06)}.e{color:#dc2626;min-height:18px;font-size:12px}
</style></head><body>
<form id="f"><h1>Quản lý nhân lực – Đăng nhập</h1><input id="u" placeholder="Email hoặc tài khoản" autofocus><input id="p" type="password" placeholder="Mật khẩu"><div class="e" id="e"></div><button>Đăng nhập</button></form>
<script src="./config.js"></script><script src="./cloud.js"></script>
<script>f.onsubmit=async e=>{e.preventDefault();const b=f.querySelector('button'),msg=document.getElementById('e');b.disabled=true;b.textContent='Đang đăng nhập…';msg.textContent='';try{const r=await HRCloud.api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value.trim(),password:p.value})});const j=await r.json().catch(()=>({}));if(r.ok){localStorage.setItem('hr_access_token',j.token);location.href=HR_CONFIG.basePath;return}msg.textContent=j.error||'Không đăng nhập được'}catch(err){msg.textContent='Không kết nối được máy chủ. Hãy tải lại trang và thử lại.'}finally{b.disabled=false;b.textContent='Đăng nhập'}}</script></body></html>
